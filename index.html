<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>Portfolio Analysis</title>
<meta name="theme-color" content="#EEECF4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Liquid Glass: matglazen panelen op zachte kleurvlakken, aubergine als enige accent; semantische kleuren apart */
:root {
  --bg: #EEECF4; --fg: #1A1524; --fg2: #4C4558; --fg3: #625A74;
  --glass: rgba(255,255,255,.58); --glass-border: rgba(255,255,255,.85); --glass-hi: rgba(255,255,255,.9); --shadow: rgba(40,25,70,.22);
  --line: rgba(40,25,70,.09); --track: rgba(40,25,70,.08);
  --gloss-a: rgba(255,255,255,.96); --gloss-b: rgba(255,255,255,.62); --gloss-border: rgba(255,255,255,.95);
  --accent: #5E2F8A; --accent-2: #8A5BB5; --accent-3: #C3A6E0; --accent-soft: rgba(94,47,138,.12); --accent-text: #5E2F8A;
  --btn-a: #8A5BB5; --btn-b: #5E2F8A;
  --warn: #9A5A0C; --warn-fill: #E0913A; --ok: #1B7A53; --ok-fill: #2DA57A; --ok-soft: #9FD9C0; --cool: #2F5FC4; --cool-fill: #5C8DEB; --bad: #B23A4C;
  --blob1: #C9B0FF; --blob2: #FFC4DA; --blob3: #B9DCFF; --blob4: #FFE2C2; --blob-op: .9;
  --island: #121016; --island-fg: #F3F1F8; --island-fg2: #A9A3B6;
  --sheet-veil: rgba(30,20,50,.18); --sheet-bg: rgba(248,246,252,.88);
  --font: 'Geist', 'SF Pro Text', system-ui, -apple-system, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-xl: 28px; --r-lg: 22px; --r-md: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0B16; --fg: #F2EEF8; --fg2: #C9C1D8; --fg3: #A79FB7;
  --glass: rgba(34,26,48,.58); --glass-border: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.08); --shadow: rgba(0,0,0,.6);
  --line: rgba(255,255,255,.08); --track: rgba(255,255,255,.09);
  --gloss-a: rgba(255,255,255,.16); --gloss-b: rgba(255,255,255,.05); --gloss-border: rgba(255,255,255,.14);
  --accent: #B58BE0; --accent-2: #9C6BCB; --accent-3: #6E4A92; --accent-soft: rgba(181,139,224,.18); --accent-text: #CDAAF0;
  --btn-a: #9C6BCB; --btn-b: #6A3A96;
  --warn: #F0B062; --warn-fill: #E0A050; --ok: #5BD39F; --ok-fill: #3CC48D; --ok-soft: #2E6B55; --cool: #9DB8F7; --cool-fill: #7FA4F0; --bad: #F08A97;
  --blob-op: .24; --island: #000; --island-fg: #F3F1F8; --island-fg2: #9C96A8; --sheet-veil: rgba(0,0,0,.45); --sheet-bg: rgba(22,17,32,.9);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F0B16; --fg: #F2EEF8; --fg2: #C9C1D8; --fg3: #A79FB7;
  --glass: rgba(34,26,48,.58); --glass-border: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.08); --shadow: rgba(0,0,0,.6);
  --line: rgba(255,255,255,.08); --track: rgba(255,255,255,.09);
  --gloss-a: rgba(255,255,255,.16); --gloss-b: rgba(255,255,255,.05); --gloss-border: rgba(255,255,255,.14);
  --accent: #B58BE0; --accent-2: #9C6BCB; --accent-3: #6E4A92; --accent-soft: rgba(181,139,224,.18); --accent-text: #CDAAF0;
  --btn-a: #9C6BCB; --btn-b: #6A3A96;
  --warn: #F0B062; --warn-fill: #E0A050; --ok: #5BD39F; --ok-fill: #3CC48D; --ok-soft: #2E6B55; --cool: #9DB8F7; --cool-fill: #7FA4F0; --bad: #F08A97;
  --blob-op: .24; --island: #000; --island-fg: #F3F1F8; --island-fg2: #9C96A8; --sheet-veil: rgba(0,0,0,.45); --sheet-bg: rgba(22,17,32,.9);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; margin: 0; -webkit-font-smoothing: antialiased; }
.app { position: relative; min-height: 100vh; overflow-x: clip; }
.blobs { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(95px); opacity: var(--blob-op); }
.wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding-block: 24px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
@media (min-width: 900px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* glas */
.glass { background: var(--glass); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); border-radius: var(--r-xl); box-shadow: 0 1px 0 var(--glass-hi) inset, 0 18px 40px -20px var(--shadow), 0 2px 6px -2px var(--shadow); min-width: 0; }
.gloss { background: linear-gradient(180deg, var(--gloss-a), var(--gloss-b)); border: 1px solid var(--gloss-border); box-shadow: 0 1px 2px -1px var(--shadow), 0 6px 14px -8px var(--shadow), inset 0 1px 0 var(--glass-hi); }
.card { padding: 24px 26px; display: grid; gap: 14px; align-content: start; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.card-h h3 { font-size: 16px; }
.cap { font-size: 13px; color: var(--fg3); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.huge { font-size: 64px; font-weight: 600; letter-spacing: -.045em; line-height: 1; }
.muted { color: var(--fg2); }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.hero { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.split { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 960px) { .hero, .split { grid-template-columns: 1fr; } }

/* topbalk */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.brand .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.navwrap { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.nav { display: flex; gap: 2px; padding: 5px; border-radius: 999px; width: max-content; }
.tab { font: inherit; font-size: 15px; color: var(--fg2); background: none; border: 1px solid transparent; border-radius: 999px; padding: 9px 16px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] { color: var(--fg); font-weight: 500; background: linear-gradient(180deg, var(--gloss-a), var(--gloss-b)); border-color: var(--gloss-border); box-shadow: 0 1px 2px -1px var(--shadow), 0 6px 14px -8px var(--shadow), inset 0 1px 0 var(--glass-hi); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.island { display: flex; align-items: center; gap: 10px; background: var(--island); color: var(--island-fg); border-radius: 999px; padding: 8px 14px 8px 10px; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); font-size: 13px; white-space: nowrap; }
.island .dot { width: 8px; height: 8px; border-radius: 50%; background: #34C77B; box-shadow: 0 0 0 3px rgba(52,199,123,.25); }
.island .mono { color: var(--island-fg2); font-size: 12px; }
.themebtn { font: inherit; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--fg2); }

/* knoppen, pillen */
.btn { font: inherit; font-size: 14px; font-weight: 500; color: #fff; border: none; border-radius: 999px; padding: 11px 18px; cursor: pointer; background: linear-gradient(180deg, var(--btn-a), var(--btn-b)); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 18px -8px var(--btn-b); }
.btn2 { font: inherit; font-size: 14px; color: var(--fg); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-bad { color: var(--bad); } .s-acc { color: var(--accent-text); } .s-mut { color: var(--fg3); } .s-cool { color: var(--cool); }
.chip { font-family: var(--mono); font-size: 13px; padding: 3px 9px; border-radius: 999px; }

/* balken */
.track { height: 10px; border-radius: 999px; background: var(--track); position: relative; box-shadow: inset 0 1px 2px var(--track); }
.track > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
.track > b { position: absolute; top: -4px; width: 3px; height: 18px; border-radius: 2px; background: var(--fg); transform: translateX(-50%); }
.track.thin { height: 7px; }
.fill-acc { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
.fill-warn { background: var(--warn-fill); } .fill-ok { background: var(--ok-fill); } .fill-cool { background: var(--cool-fill); }
.rows { display: grid; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; }
.row > span:first-child { color: var(--fg2); min-width: 0; }
.row > span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.prow { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 2.6rem; gap: 12px; align-items: center; font-size: 14px; }
.prow .v { text-align: right; font-family: var(--mono); }

/* begroeting */
.hello { display: grid; gap: 8px; padding-top: 6px; }
.hello h1 { margin: 0; font-size: clamp(34px, 5vw, 48px); font-weight: 600; letter-spacing: -.035em; line-height: 1.05; text-wrap: balance; }
.hello p { margin: 0; font-size: 18px; color: var(--fg2); max-width: 64ch; line-height: 1.5; }
.hello p b { color: var(--fg); font-weight: 600; }

/* tabellen */
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--fg3); padding: 8px 10px; white-space: nowrap; }
th button { all: unset; cursor: pointer; }
th[aria-sort="ascending"] button::after { content: " ↑"; } th[aria-sort="descending"] button::after { content: " ↓"; }
td { padding: 12px 10px; border-top: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
.minibar { display: inline-block; vertical-align: middle; width: 70px; height: 7px; border-radius: 999px; background: var(--track); margin-right: 10px; position: relative; overflow: hidden; }
.minibar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
@media (max-width: 760px) { .opt { display: none; } }

/* segment */
.seg { display: inline-flex; padding: 4px; border-radius: 999px; gap: 2px; }
.seg button { font: inherit; font-size: 14px; border: 1px solid transparent; background: none; color: var(--fg2); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--fg); background: linear-gradient(180deg, var(--gloss-a), var(--gloss-b)); border-color: var(--gloss-border); box-shadow: 0 4px 10px -6px var(--shadow); }
.search { font: inherit; font-size: 14px; color: var(--fg); background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px; padding: 9px 16px; min-width: 0; width: 220px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* beslisketen */
.chain { display: grid; grid-template-columns: minmax(0,1fr) 36px minmax(0,1fr) 36px minmax(0,1.2fr); align-items: center; gap: 8px; }
.step { border-radius: 20px; padding: 18px 20px; display: grid; gap: 6px; }
.step.final { color: #fff; background: linear-gradient(180deg, var(--btn-a), var(--btn-b)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 14px 26px -14px var(--btn-b); }
.step.final .cap { color: rgba(255,255,255,.8); }
@media (max-width: 860px) { .chain { grid-template-columns: 1fr; } .chain svg { transform: rotate(90deg); justify-self: center; } }

/* kandidaat-kaart */
.score-ball { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 600; flex: none; }

/* kansenkaart */
.plot { position: relative; }
.plot svg { display: block; width: 100%; height: auto; }
.plot text { font-family: var(--font); }
.tip { position: absolute; pointer-events: none; padding: 10px 12px; border-radius: 14px; font-size: 13px; display: grid; gap: 2px; min-width: 170px; z-index: 5; }

/* sheet */
.veil { position: fixed; inset: 0; background: var(--sheet-veil); z-index: 40; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: min(980px, calc(100% - 24px)); z-index: 41; overflow-y: auto; padding: 26px 28px 40px; display: grid; gap: 18px; align-content: start; background: var(--sheet-bg); }
.sheet .glass { background: var(--glass); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .32s cubic-bezier(.2,.8,.2,1); } @keyframes rise { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } } }
.close { font: inherit; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: var(--fg); display: grid; place-items: center; flex: none; }
.chk { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; align-items: start; font-size: 14px; padding: 7px 0; border-top: 1px solid var(--line); }
.chk .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.news a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.news a:hover { text-decoration-color: var(--accent); }
.case p { margin: 0; line-height: 1.55; max-width: 68ch; }
.k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); margin-bottom: 4px; }
ul.ontw { margin: 0; padding-left: 1.1rem; display: grid; gap: 8px; line-height: 1.5; }

.plainbtn { background: none; border: none; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 10px; }
.empty { padding: 36px; text-align: center; display: grid; gap: 8px; justify-items: center; }
/* verhaal, thema's, financiën */
.story { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.story section { display: grid; gap: 6px; align-content: start; }
.story p { margin: 0; line-height: 1.6; }
.story ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 6px; line-height: 1.5; }
.story .lead { grid-column: 1 / -1; font-size: 18px; line-height: 1.5; font-weight: 500; letter-spacing: -.01em; max-width: 70ch; }
.verdict { grid-column: 1 / -1; padding: 16px 18px; border-radius: 18px; }
.imp { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 13px; font-weight: 700; color: #fff; flex: none; }
.imp.positief { background: var(--ok-fill); } .imp.negatief { background: var(--bad); } .imp.gemengd { background: var(--warn-fill); }
.party { display: grid; grid-template-columns: 22px 78px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; width: 100%; box-sizing: border-box; }
.party b { font-weight: 600; }
.scen { display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
/* chat */
.fab { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 42; display: flex; gap: 8px; align-items: center; padding: 13px 20px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 500; color: #fff; border: none; cursor: pointer; background: linear-gradient(180deg, var(--btn-a), var(--btn-b)); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 14px 30px -10px var(--btn-b); }
.chat { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: min(460px, calc(100% - 32px)); height: min(680px, calc(100% - 32px)); z-index: 45; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; background: var(--sheet-bg); border-radius: 28px; overflow: hidden; }
.chat-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 10px; gap: 10px; }
.msgs { overflow-y: auto; padding: 6px 18px 12px; display: grid; gap: 12px; align-content: start; }
.msg { font-size: 14.5px; line-height: 1.55; max-width: 92%; overflow-wrap: anywhere; }
.msg.u { justify-self: end; color: #fff; background: linear-gradient(180deg, var(--btn-a), var(--btn-b)); border-radius: 18px 18px 4px 18px; padding: 10px 14px; }
.msg.a { justify-self: start; border-radius: 18px 18px 18px 4px; padding: 12px 15px; }
.msg.a p { margin: 0 0 8px; } .msg.a p:last-child { margin: 0; } .msg.a ul { margin: 0 0 8px; padding-left: 1.1rem; display: grid; gap: 4px; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 10px; }
.sug { font: inherit; font-size: 13px; border-radius: 999px; padding: 7px 12px; cursor: pointer; color: var(--fg); text-align: left; }
.composer { display: flex; gap: 8px; padding: 12px 14px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; resize: none; font: inherit; font-size: 15px; color: var(--fg); background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px; padding: 10px 14px; max-height: 120px; min-height: 44px; }
.typing { color: var(--fg3); font-size: 14px; }
/* kalender */
.cal-row { display: grid; grid-template-columns: 64px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 120px; gap: 14px; align-items: center; padding: 12px 6px; border-top: 1px solid var(--line); width: 100%; box-sizing: border-box; }
.cal-day { width: 56px; height: 60px; border-radius: 16px; display: grid; place-items: center; align-content: center; line-height: 1.05; }
.cal-day b { font-size: 22px; font-weight: 600; } .cal-day span { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 860px) { .cal-row { grid-template-columns: 64px minmax(0, 1fr) 110px; } .cal-row .opt2 { display: none; } }
.mtiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
.mtile { padding: 14px 16px; border-radius: 20px; display: grid; gap: 4px; align-content: start; }
.mtile .big { font-size: 22px; }
.foot { text-align: center; font-size: 12px; color: var(--fg3); max-width: 70ch; margin: 0 auto; line-height: 1.5; }
.lock { max-width: 420px; margin: 60px auto; padding: 36px 34px; display: grid; gap: 16px; text-align: center; justify-items: center; }
.lock input[type=password] { font: inherit; font-size: 16px; width: 100%; color: var(--fg); background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px 16px; }
.lock label.rem { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--fg2); }
.loading { padding: 80px 0; text-align: center; color: var(--fg3); }
</style>


</head>
<body>
<div class="app">
  <div class="blobs" aria-hidden="true">
    <i style="width:640px;height:640px;left:-160px;top:-200px;background:var(--blob1)"></i>
    <i style="width:560px;height:560px;right:-140px;top:120px;background:var(--blob2)"></i>

      { name: 'portefeuille', description: 'Juup\'s posities met weging, de sectorverdeling tegenover de wereldindex en de maandkeuze.', execute: () => ({ posities: D.portfolio, sectoren: D.blootstelling, maandkeuze: D.mk }) },
      { name: 'ontwikkelingen', description: 'De samenhangende thema\'s van deze maand (bijv. AI-bouwgolf, luxedip) met welke bedrijven positief of negatief geraakt worden en waarom.', execute: () => D.vb },
      { name: 'macro', description: 'Rente (ECB, VS 10 jaar), rentecurve, euro/dollar, VIX en marktsentiment, met een korte duiding.', execute: () => ({ macro: D.macro, markt: D.m }) },
      { name: 'etfs', description: 'De vergeleken ETF\'s met score, kosten, aandeel VS, Big Tech-gewicht en samenhang met de portefeuille.', execute: () => D.etfs },
      { name: 'earnings', description: 'Komende kwartaalcijfers van bedrijven in de cockpit met datum en verwachtingen.', execute: () => D.aandelen.filter((r) => r.volgendeEarnings).map((r) => ({ ticker: r.ticker, datum: r.volgendeEarnings, epsVerwacht: r.epsVerwacht, omzetVerwachtMld: r.omzetVerwachtMld, vorigeVerrassing: r.laatsteVerrassing })) },
    ];
    async function ask(q) {
      q = String(q || '').trim(); if (!q || busy) return;
      sugs.hidden = true; input.value = '';
      msgs.append(h('div', { class: 'msg u' }, q));
      const bubble = h('div', { class: 'msg a glass' }, h('span', { class: 'typing' }, 'Even nadenken…'));
      msgs.append(bubble); msgs.scrollTop = msgs.scrollHeight;
      turns.push({ role: 'user', content: q });
      while (turns.length > 12) turns.shift();
      busy = true; sendBtn.textContent = 'Stop'; ctl = new AbortController();
      try {
        const opts = { cache: false, signal: ctl.signal, onText: ({ text }) => { bubble.replaceChildren(md(text)); msgs.scrollTop = msgs.scrollHeight; } };
        if (toolsOk) opts.tools = tools.map((t) => ({ ...t, execute: (inp) => { bubble.firstChild && bubble.firstChild.classList && bubble.firstChild.classList.contains('typing') && (bubble.firstChild.textContent = 'Gegevens bekijken…'); return t.execute(inp); } }));
        const { text } = await sample([{ role: 'user', content: rules() }, ...turns], opts);
        bubble.replaceChildren(md(text)); turns.push({ role: 'assistant', content: text });
      } catch (e) {
        const keep = e && e.text; bubble.replaceChildren(keep ? md(keep) : document.createTextNode(''));
        const msg = { not_granted: 'Je hebt Claude in deze app niet toegestaan. Dat kan via het Permissions-menu van de pagina.', rate_limited: 'Even te veel vragen achter elkaar. Probeer het zo opnieuw.', cancelled: 'Gestopt.', sampling_disabled: 'Claude is niet beschikbaar voor dit account.', refused: 'Daar kan ik niet op antwoorden. Probeer de vraag anders te stellen.' }[e && e.code] || 'Er ging iets mis bij het ophalen van het antwoord. Probeer het opnieuw.';
        bubble.append(h('p', { class: 'cap' }, msg));
        if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) { fab.remove(); }
        turns.pop();
      } finally { busy = false; sendBtn.textContent = 'Vraag'; msgs.scrollTop = msgs.scrollHeight; }
    }
  }
})();
</script>
